workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Create .env file
        script: |
          touch .env
          echo "GEMINI_API_KEY=" > .env
      - name: Build Android APK
        script: |
          gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - monirujaman6002@gmail.com
        notify:
          success: true
          failure: false
